# Merge this policy into the installed plugin's Codex configuration.
# It is defence-in-depth for the MVP, not a server-side security boundary.

[plugins."anstar-dataverse@anstar-ai".mcp_servers.anstar-dataverse]
enabled = true
default_tools_approval_mode = "prompt"
enabled_tools = ["dv_status", "dv_connect", "dv_tools", "dv_call"]

[plugins."anstar-dataverse@anstar-ai".mcp_servers.anstar-dataverse.tools.dv_status]
approval_mode = "approve"

[plugins."anstar-dataverse@anstar-ai".mcp_servers.anstar-dataverse.tools.dv_connect]
approval_mode = "approve"

[plugins."anstar-dataverse@anstar-ai".mcp_servers.anstar-dataverse.tools.dv_tools]
approval_mode = "approve"

[plugins."anstar-dataverse@anstar-ai".mcp_servers.anstar-dataverse.tools.dv_call]
approval_mode = "approve"
