name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-bc-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Codex validation CLI
        run: npm install --prefix "$RUNNER_TEMP/codex-cli" --ignore-scripts @openai/codex@0.146.0
      - name: Verify disabled BC plugin with network denied
        run: python scripts/smoke_business_central.py --codex-bin "$RUNNER_TEMP/codex-cli/node_modules/.bin/codex"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin packages
        run: python scripts/validate_plugins.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Install pinned Gitleaks scanner
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan committed content for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
